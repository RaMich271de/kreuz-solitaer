name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17 einstellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Systempakete
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev \
            cmake libffi-dev libssl-dev

      - name: Buildozer installieren
        run: pip install --upgrade pip buildozer cython

      - name: Buildozer-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v1-${{ runner.os }}-

      - name: APK bauen
        run: buildozer -v android debug > buildozer.log 2>&1

      - name: Fehlerstelle anzeigen
        if: failure()
        run: |
          echo "=== Gradle-Fehler ==="
          grep -n -A 25 "What went wrong" buildozer.log | head -n 80 || true
          echo "=== Zeilen vor Command failed (ohne export) ==="
          grep -v "^export " buildozer.log | grep -B 60 "Command failed" | head -n 100 || true

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kreuz-solitaer-apk
          path: bin/*.apk
          retention-days: 30
